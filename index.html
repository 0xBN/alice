<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alice list</title>
    <link rel="stylesheet" href="./styles.css" />
    <script>
      (function () {
        try {
          var s = localStorage.getItem("alice_theme");
          var dark =
            s === "dark" ||
            (s !== "light" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute(
            "data-theme",
            dark ? "dark" : "light",
          );
        } catch (_) {}
      })();
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="top">
        <div class="title-row">
          <h1>Alice list</h1>
          <button type="button" class="theme-btn" id="theme-toggle" aria-label="Toggle dark mode">
            Dark
          </button>
        </div>
        <div class="top-row" id="meta-row" hidden>
          <p class="sub" id="last-sync"></p>
          <label class="hide-toggle">
            <span id="hide-label">Hide details</span>
            <input type="checkbox" id="hide-done" />
          </label>
        </div>
        <p class="sub" id="status">Sign in to load your list.</p>
        <button type="button" id="login" hidden>Sign in with Google</button>
      </header>
      <div id="list" class="list" aria-live="polite"></div>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
